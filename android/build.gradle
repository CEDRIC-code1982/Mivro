buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // [ADDED] Chemin explicite vers react-native pour éviter que les libs
        // (react-native-svg, etc.) lancent `node` via providers.exec — Volta
        // n'est pas dans le PATH du daemon Gradle.
        REACT_NATIVE_NODE_MODULES_DIR = file("${rootDir}/../node_modules/react-native")
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // [ADDED] F4 — Plugin Google Services (Firebase). Le plugin lit le
        // fichier google-services.json fourni par Cédric dans android/app/.
        // [ADDED] F4 — Google Services (Firebase) plugin. Reads the
        // google-services.json file (provided by Cédric) in android/app/.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"
